# fairseq2 textlm recipe: lh-6kh-300m.
# Prepare train/valid token shards before training; see REPRODUCING.md.
# Original launch size: 1 nodes x 8 GPUs.
model_preset: opt350m
model:
  family: opt
  arch: metasr_text_opt
  vocab_size: 4096
  dtype: bfloat16
dataset:
  family: metasr_text
  path: /path/to/tokens/lh-6kh-300m
  train_split: train
  valid_split: valid
  unit_offset: 0
  min_seq_len: 2
  max_seq_len: 2048
  max_num_tokens: 61440
  pack: true
trainer:
  data_parallelism: ddp
  max_grad_norm: 0.5
optimizer:
  name: adamw
  config:
    lr: 0.005
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 0.01
    impl: fused
lr_scheduler:
  name: cosine_annealing
  config:
    num_warmup_steps: 1000
    start_lr: 4.9999999999999995e-31
    final_lr_scale: 0.1
regime:
  num_steps: 20000
  validate_at_start: true
  validate_every_n_steps: 1000
  checkpoint_every_n_steps: 1000
  publish_metrics_every_n_steps: 100
  keep_last_n_checkpoints: 2
  keep_best_n_checkpoints: 1
  score_metric: nll_loss
common:
  seed: 0
  metric_recorders:
    wandb:
      enabled: false
      project: gslm2
      run_name: textlm-lh-6kh-300m-seed0
is_train_deterministic: true
