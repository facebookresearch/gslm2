# SpidR 2.0 L5-L10 duration training on full-rate raw code IDs.
# sbatch scripts/launchers/slurm_duration.sbatch configs/yosukeh/misc/duration/spidr2-ms-slm_codes-l5-l6-l7-l8-l9-l10.yaml
train_dirs:
- /checkpoint/devai/yosukeh/gslm2_test/framewise_units/spidr2-ms-slm_codes-l5-l6-l7-l8-l9-l10-dup/5/duration_predictor
valid_dirs:
