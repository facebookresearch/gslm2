  train:
    model_preset: opt1b
    dataset:
      family: metasr_unit
      train_split: train
      valid_split: valid
      valid_metrics:
        names:
        - tSC_dev_expanded
        - lexical_dev_invocab
        - lexical_dev_oov
        - syntactic_dev
        max_pairs: 1000
        batch_size: 32
      min_seq_len: 2
      max_seq_len: 2048
      max_num_tokens: 40960
      batch_shuffle_window: 1000
      example_shuffle_window: 0
      unit_offset: 2
    trainer:
      grad_accumulation:
        num_batches: 1
      max_grad_norm: 0.5
      grad_check: false
      anomaly_detection: false
      data_parallelism: ddp
    optimizer:
      config:
        lr: 1e-3
        betas:
        - 0.9
        - 0.95
        eps: 1e-08
        weight_decay: 0.1
        differentiable: false
        impl: fused
      name: adamw
    lr_scheduler:
      config:
        cycle_len: null
        num_warmup_steps: 1000
        cycle_mul: 1.0
        lr_mul: 1.0
        start_lr: 1e-30
        final_lr: null
        final_lr_scale: 0.1
      name: cosine_annealing
    regime:
      num_steps: 150000
      validate_every_n_steps: 100
      checkpoint_every_n_steps: 100
      publish_metrics_every_n_steps: 100
      keep_best_n_checkpoints: 1
      keep_last_n_checkpoints: 1
      score_metric: nll_loss
    common:
      metric_recorders:
        wandb:
          enabled: true
          project: gslm2_test
          run_id: null
          run_name: null
          group: null
          job_type: null
          resume_mode: allow
      no_sweep_dir: true
      seed: 0
    model:
      family: opt
      arch: metasr_unit_opt
      vocab_size: 256
      dtype: bfloat16
    is_train_deterministic: true
  eval:
    offset: 2
    bos: null
    delete_data_model_after_eval: false
