# SpidR 2.0 encoder (90M) on LibriSpeech-960h. Paper: 400k steps, 16 GPUs,
# global batch ~63 min audio, AdamW (0.9, 0.95), peak LR 2e-4 with 12k warmup /
# 188k hold / 200k decay, feature extractor + teacher frozen at 200k steps.
run:
  workdir: /checkpoint/devai/yosukeh/gslm2_test/spidr2.0-ls960
  wandb_project: gslm2
  wandb_name: spidr2.0-ls960-seed0
  wandb_mode: disabled
  model_type: spidr
  save_interval: 20000
  log_interval: 200
  random_seed: 0

data:
  manifest: /datasets/metaspeechssl/shared/assets/manifests/train-full-archive.csv

model:
  teacher_use_heads: true
  use_soft_targets: true
  heads_layer_norm: center
  heads_use_weight_norm: true
  heads_init: sphere

  regularisation:
    reg_student: false
    reg_teacher: true

    codebook_entropy_weight: 0.1
    codebook_entropy_schedule: constant_then_exponential_decrease

    predictive_entropy_weight: 0.1
    predictive_entropy_schedule: constant

masking:
  mask_prob: 0.8
  mask_selection: static
  mask_other: 0.0
  mask_length: 10
  no_mask_overlap: false
  mask_min_space: 1
  mask_channel_prob: 0.0
  mask_channel_selection: static
  mask_channel_other: 0.0
  mask_channel_length: 10
  no_mask_channel_overlap: false
  mask_channel_min_space: 1
  legacy_mask_drop: true
  mask_drop_prob: 0.11

optimizer:
  lr: 0.0002

validation:
  - eval_type: loss
    config:
      group: dev-clean
      data:
        manifest: /datasets/metaspeechssl/shared/assets/manifests/zr2021-dev-clean.tsv
  - eval_type: loss
    config:
      group: dev-other
      data:
        manifest: /datasets/metaspeechssl/shared/assets/manifests/zr2021-dev-other.tsv
  - eval_type: abx
    config:
      subset:
        manifest: /datasets/metaspeechssl/shared/assets/manifests/zr2021-dev-clean.tsv
        item_file: /datasets/metaspeechssl/shared/assets/item/triphone-dev-clean.item
      codebook_proba: false
  - eval_type: abx
    config:
      subset:
        manifest: /datasets/metaspeechssl/shared/assets/manifests/zr2021-dev-other.tsv
        item_file: /datasets/metaspeechssl/shared/assets/item/triphone-dev-other.item
      codebook_proba: false
