# Duration predictor for GSLM2 (6 streams, layers 5-10, cross-stream dedup).
# Paper: larger Conformer (8 layers, dim 192, FFN 768); per-stream embeddings
# concatenated; one shared duration per tuple. Same schedule as single-stream.
duration_predictor:
  train_dirs:
    - /path/to/feats/spidr2-l5to10-dedup/train
  valid_dirs:
    - /path/to/feats/spidr2-l5to10-dedup/valid
  train_file_pattern: "small_segmented*.txt"
  valid_file_pattern: "*.txt"
  output_dir: /path/to/runs/duration-multi

  vocab_size: 256
  num_streams: 6
  max_duration: 50
  log_duration: true
  loss_type: classification
  num_classes: 50

  embed_dim: 192
  hidden_dim: 192
  num_layers: 8
  dropout: 0.1

  encoder_type: conformer
  attention_heads: 4
  conv_kernel: 17
  ffn_expansion: 4

  batch_size: 64
  max_seq_len: 2048
  num_workers: 4
  max_steps: 25000
  lr: 3e-3
  weight_decay: 1e-5
  warmup_steps: 1000
  log_interval: 100
  val_interval: 1000
  seed: 0
