# Text LM topline (300M) on Libriheavy transcripts (6Kh scale).
# Paper: 20k steps, 8 GPUs (DDP), global batch 491520 tokens, ctx 2048,
# peak LR 5e-3 (cosine, 1k warmup). Per-GPU batch: 30 packed rows x 2048.
# Tokenizer/validation notes as in lh-600h-90m.yaml.
run:
  workdir: /path/to/runs/textlm-lh-6kh-300m
  wandb_project: gslm2
  wandb_name: textlm-lh-6kh-300m-seed0
  wandb_mode: offline
  random_seed: 0
  slurm:
    nodes: 1
    gpus_per_node: 8
    cpus_per_task: 16
  log_interval: 100
  save_interval: 1000
  model_type: opt
  keep_latest: 2

data:
  manifests:
    - /path/to/libriheavy-medium.txt
  manifests_weights: [1.0]
  tokenizer: /path/to/tokenizers/lh-medium-bpe4096
  task: causal
  max_length: 2048
  batch_size: 30
  packing: true
  drop_last: true
  num_workers: 4
  pin_memory: true
  random_seed: 0

model:
  vocab_size: 4096
  model_dim: 1024
  num_layers: 24
  num_attn_heads: 16
  num_key_value_heads: 16
  ffn_inner_dim: 4096
  max_seq_len: 2048
  pad_idx: null
  tie_word_embeddings: false
  ffn_activation: relu
  pos_embed_pad_offset: 2
  init_scheme: standard

optimizer:
  lr: 0.005
  betas: [0.9, 0.95]
  eps: 1.0e-08
  weight_decay: 0.01
  max_norm: 0.5
  dtype: bfloat16
  scheduler: cosine
  max_steps: 20000
  warmup_steps: 1000
  init_lr_scale: 1.0e-28
  final_lr_scale: 0.1
