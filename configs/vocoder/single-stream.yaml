# Single-stream unit HiFi-GAN on SpidR 2.0 layer-7 units (LJ Speech).
# Paper: 128-dim unit embeddings, upsampling strides (5,4,4,2,2), MRF kernels
# (3,7,11) dilations (1,3,5); MPD{2,3,5,7,11} + 3-scale MSD, LS-GAN +
# feature-matching + 45x L1 log-mel. 2k epochs, batch 64 (8 GPUs) over
# 0.56 s segments, AdamW (0.8,0.99), wd 0.01, LR 2e-4 exp-decay 0.999/epoch.
# Extract LJ Speech units first (see DATA.md).
unit_vocoder:
  workdir: /path/to/runs/vocoder-single
  train_manifest: /path/to/feats/spidr2-l7-dup/unit_vocoder/ljspeech_train.jsonl
  val_manifest: /path/to/feats/spidr2-l7-dup/unit_vocoder/ljspeech_valid.jsonl
  n_units: 256

  max_epochs: 2000
  seed: 1234
  lr: 0.0002
  betas: [0.8, 0.99]
  gamma: 0.999
  batch_size: 64
  segment_size: 8960
  units_hop_size: 320
  dtype: bfloat16
  log_interval: 100
  val_interval: 5000
