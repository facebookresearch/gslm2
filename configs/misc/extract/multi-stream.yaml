# Full-rate aligned SpidR L5-L10 codes for six-stream vocoder and duration training.
# Preserve stream order and frame repetitions; the unit hop must be 320 samples at 16 kHz.
checkpoint: /path/to/encoder.pt
model_type: spidr
manifests_train: [/path/to/train.csv]
manifests_valid: [/path/to/valid.csv]
manifests_test: []
output_folder: /path/to/framewise-units/multi-stream
output_format: jsonl
layers: [5, 6, 7, 8, 9, 10]
vocab_size: [256, 256, 256, 256, 256, 256]
clustering: codes
deduplicate: false
cross_stream_deduplicate: false
chunk: false
batch_size: 8
encoder_dtype: float32
