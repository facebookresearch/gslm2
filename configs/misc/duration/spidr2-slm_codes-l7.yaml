# Duration training on full-rate raw code IDs.
# Replace /path/to/... with your local paths before launching.
# sbatch scripts/launchers/slurm_duration.sbatch configs/misc/duration/spidr2-slm_codes-l7.yaml
train_dirs:
- /path/to/framewise-units/spidr2-slm_codes-l7-dup/7/duration_predictor
valid_dirs:
- /path/to/framewise-units/spidr2-slm_codes-l7-dup/7/duration_predictor
train_file_pattern: 'small_segmented*.txt'
valid_file_pattern: 'large_segmented_60s_dev*.txt'
output_dir: /path/to/runs/duration_predictor/spidr2-slm_codes-l7
vocab_size: 256
num_streams: 1
max_duration: 50
log_duration: true
loss_type: classification
num_classes: 50
embed_dim: 128
hidden_dim: 128
num_layers: 6
dropout: 0.1
encoder_type: conformer
attention_heads: 4
conv_kernel: 17
ffn_expansion: 4
batch_size: 64
max_seq_len: 2048
num_workers: 4
max_steps: 25000
lr: 3e-3
weight_decay: 1e-5
warmup_steps: 1000
log_interval: 100
val_interval: 1000
seed: 0
