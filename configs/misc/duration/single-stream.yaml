# single-stream duration training on full-rate raw code IDs.
train_dirs:
- /path/to/full-rate-units/train
valid_dirs:
- /path/to/full-rate-units/valid
train_file_pattern: '*.txt'
valid_file_pattern: '*.txt'
output_dir: /path/to/runs/duration-single-stream
vocab_size: 256
num_streams: 1
max_duration: 50
log_duration: true
loss_type: classification
num_classes: 50
embed_dim: 128
hidden_dim: 128
num_layers: 6
dropout: 0.1
encoder_type: conformer
attention_heads: 4
conv_kernel: 17
ffn_expansion: 4
batch_size: 64
max_seq_len: 2048
num_workers: 4
max_steps: 25000
lr: 3e-3
weight_decay: 1e-5
warmup_steps: 1000
log_interval: 100
val_interval: 1000
seed: 0
