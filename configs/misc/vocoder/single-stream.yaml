# single-stream vocoder training on full-rate raw code IDs.
workdir: /path/to/runs/vocoder-single-stream
train_manifest: /path/to/full-rate-units/train.jsonl
val_manifest: /path/to/full-rate-units/valid.jsonl
n_units: 256
max_epochs: 2000
seed: 1234
lr: 0.0002
betas:
- 0.8
- 0.99
gamma: 0.999
batch_size: 64
segment_size: 8960
units_hop_size: 320
dtype: bfloat16
log_interval: 100
val_interval: 5000
max_steps: 500000
num_workers: 4
