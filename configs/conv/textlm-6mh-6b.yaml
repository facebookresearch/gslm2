# Text LM (6.5B) on ASR transcripts of conversational 6Mh.
# Paper: 600k steps, 32 GPUs (FSDP), global batch 688128 tokens, ctx 2048,
# peak LR 3e-4, tri-stage 60k/240k/300k. Per-GPU batch: 10 packed rows.
# final_lr_scale 0.1 is assumed (paper does not report the 6.5B decay floor).
# NOTE: 2.5B+ models need FSDP (native trainer is DDP-only until then).
run:
  workdir: /path/to/runs/textlm-conv-6mh-6b
  wandb_project: gslm2
  wandb_name: textlm-conv-6mh-6b-seed0
  wandb_mode: offline
  random_seed: 0
  slurm:
    nodes: 4
    gpus_per_node: 8
    cpus_per_task: 16
  log_interval: 100
  save_interval: 10000
  model_type: opt
  keep_latest: 2

data:
  manifests:
    - /path/to/conv-6mh-asr.txt
  manifests_weights: [1.0]
  tokenizer: /path/to/tokenizers/conv-6mh-bpe4096
  task: causal
  max_length: 2048
  batch_size: 10
  packing: true
  drop_last: true
  num_workers: 4
  pin_memory: true
  random_seed: 0

model:
  vocab_size: 4096
  model_dim: 4096
  num_layers: 32
  num_attn_heads: 32
  num_key_value_heads: 32
  ffn_inner_dim: 16384
  max_seq_len: 2048
  pad_idx: null
  tie_word_embeddings: false
  ffn_activation: relu
  pos_embed_pad_offset: 2
  init_scheme: standard

optimizer:
  lr: 0.0003
  betas: [0.9, 0.95]
  eps: 1.0e-08
  weight_decay: 0.01
  max_norm: 0.5
  dtype: bfloat16
  scheduler: tristage
  max_steps: 600000
  warmup_steps: 60000
  hold_steps: 240000
  decay_steps: 300000
  init_lr_scale: 1.0e-26
  final_lr_scale: 0.1
