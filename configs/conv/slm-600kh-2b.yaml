# Single-stream SLM (2.5B) on conversational speech 600Kh.
# Paper: 350k steps, 32 GPUs (FSDP), global batch 917504 units, ctx 2048,
# peak LR 8e-4 (cosine, 1k warmup). Per-GPU audio batch 32.8M samples.
# NOTE: 2.5B+ models need FSDP (native trainer is DDP-only until then).
run:
  workdir: /path/to/runs/slm-conv-600kh-2b
  wandb_project: gslm2
  wandb_name: slm-conv-600kh-2b-seed0
  wandb_mode: offline
  random_seed: 0
  slurm_validation:
    account: ACCOUNT  # set your Slurm account
    nodes: 1
    gpus_per_node: 1
    cpus_per_task: 10
    time: 60
  slurm:
    nodes: 4
    gpus_per_node: 8
    cpus_per_task: 16
  log_interval: 100
  save_interval: 5000
  model_type: opt
  keep_best_n: 1
  keep_latest: 1

data:
  num_streams: 1
  source:
    audio:
      manifest: /path/to/conv-600kh.csv
      rand_crop: false  # deterministic crops; required for unit_cache_dir
      normalize: true
      max_sample_size: 960000  # 60 s @ 16 kHz
      min_sample_size: 32000  # 2 s
      max_batch_length: 32800000  # per-GPU audio samples ~= paper unit batch
      num_workers: 8
      pin_memory: true
    feature_extraction:
      checkpoint: /path/to/spidr2.0-seed0-final.pt  # see MODEL_ZOO.md
      model_type: spidr
      extract_layer: 7
      codebook_size: 256
      unit_offset: 2
      deduplicate: true
      max_token_seq_len: 2048
      encoder_micro_batch: 10
      dtype: float32
      unit_cache_dir: /path/to/unit-cache/slm-conv-600kh-2b

model:
  vocab_size: 258  # 256 codes + PAD(0) + EOS(1)
  model_dim: 2560
  num_layers: 32
  num_attn_heads: 32
  num_key_value_heads: 32
  ffn_inner_dim: 10240
  max_seq_len: 2049
  pad_idx: 1
  tie_word_embeddings: false
  ffn_activation: relu
  pos_embed_pad_offset: 2
  init_scheme: standard

optimizer:
  lr: 0.0008
  betas: [0.9, 0.95]
  eps: 1.0e-08
  weight_decay: 0.1
  max_norm: 0.5
  dtype: bfloat16
  scheduler: cosine
  max_steps: 350000
  warmup_steps: 1000
  init_lr_scale: 1.0e-28
  final_lr_scale: 0.1

validation:
  - eval_type: lm_loss
    eval_name: lm-loss
    eval_interval: 5000
    config:
      model_type: opt
      lm_config: /path/to/gslm2/configs/conv/slm-600kh-2b.yaml  # this file
      dev_manifest: /path/to/conv-dev.csv
      score_batch_size: 512
      unit_cache_dir: /path/to/unit-cache/loss-spidr2.0-seed0
  - eval_type: slm
    eval_name: slm-valid
    eval_interval: 5000
    config:
      model_type: opt
      lm_config: /path/to/gslm2/configs/conv/slm-600kh-2b.yaml  # this file
      benchmarks: [tSC_dev_expanded, lexical_dev_invocab, lexical_dev_oov, syntactic_dev]
      pairs_dir: /path/to/sLM21-pairs
      max_pairs: 5000
      batch_size: 512
      unit_cache_dir: /path/to/unit-cache/pairs-spidr2.0-seed0
