# Six-stream units: SpidR 2.0 layers 5-10 codebook codes, cross-stream
# deduplicated (aligned BPE-free tuples), chunked to 4096 (GSLM2 inputs).
checkpoint: /path/to/spidr2.0-seed0-final.pt
model_type: spidr
manifests_train: [/path/to/librilight-6kh.csv]
manifests_valid: [/path/to/librilight-dev.csv]
manifests_test: []
output_folder: /path/to/feats/spidr2-l5to10-dedup
layers: [5, 6, 7, 8, 9, 10]
deduplicate: false
cross_stream_deduplicate: true
chunk: true
chunk_size: 4096
batch_size: 8
clustering: codes
vocab_size: [256, 256, 256, 256, 256, 256]
