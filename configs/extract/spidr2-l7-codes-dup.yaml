# Non-deduped layer-7 units over LJ Speech (unit-vocoder inputs) plus the
# LL-600h deduped copy (duration-predictor inputs): run twice, once per
# output_folder/manifests pair, or point manifests_unit_vocoder at LJ Speech.
checkpoint: /path/to/spidr2.0-seed0-final.pt
model_type: spidr
manifests_train: [/path/to/librilight-600h.csv]
manifests_valid: [/path/to/librilight-dev.csv]
manifests_test: []
manifests_unit_vocoder: [/path/to/ljspeech.csv]
output_folder: /path/to/feats/spidr2-l7-dup
layers: [7]
deduplicate: false
chunk: true
chunk_size: 2048
batch_size: 8
clustering: codes
vocab_size: 256
