# K-means units on a SpidR (v1) encoder, layer 6, fitted on train-clean-100
# (SpidR SLM baseline). Swap checkpoint/layer for the HuBERT layer-11 baseline.
checkpoint: /path/to/spidr-seed0-final.pt
model_type: spidr
manifests_train: [/path/to/librilight-6kh.csv]
manifests_valid: [/path/to/librilight-dev.csv]
manifests_test: []
manifests_train_kmeans: [/path/to/librispeech-train-clean-100.csv]
output_folder: /path/to/feats/spidr-l6-kmeans
layers: [6]
deduplicate: true
chunk: true
chunk_size: 2048
batch_size: 8
clustering: kmeans
vocab_size: 256
kmeans_pooling_width: 1
