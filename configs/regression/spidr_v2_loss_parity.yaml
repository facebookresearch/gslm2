# SpidR-v2 (sjepa) tiny config for N-step loss parity (deterministic, max_steps=50).
# Same tiny SpidR SSL setup as spidr_loss_parity.yaml, plus the distinguishing
# spidr_v2 settings: soft teacher targets from normalized heads + predictive and
# codebook entropy regularisation (mirrors configs/mahiluthra/spidr_v2.yaml).

run:
  workdir: ${METASR_REGRESSION_WORKDIR}
  wandb_project: regression
  wandb_name: spidr_v2_loss_parity
  wandb_mode: disabled
  random_seed: 42
  use_deterministic: true
  log_interval: 1
  save_interval: 50
  keep_latest: 1
  model_type: spidr

data:
  manifest: ${METASR_REGRESSION_MANIFEST}
  num_buckets: 4
  min_sample_size: 1000
  max_sample_size: 32000
  max_batch_length: 256000
  num_workers: 0
  prefetch_factor: null
  persistent_workers: false
  pin_memory: false
  random_seed: 42

model:
  extractor_conv_layer_config:
    - [64, 10, 5]
    - [64, 3, 2]
    - [64, 3, 2]
  encoder_embed_dim: 64
  encoder_num_layers: 2
  encoder_num_heads: 4
  encoder_ff_interm_features: 128
  encoder_pos_conv_kernel: 15
  encoder_pos_conv_depth: 1
  encoder_pos_conv_groups: 4
  encoder_attention_dropout: 0.0
  encoder_ff_interm_dropout: 0.0
  encoder_dropout: 0.0
  encoder_layer_drop: 0.0
  codebook_size: 64
  num_codebooks: 2
  freeze_step: 1000000
  teacher_use_heads: true
  use_soft_targets: true
  heads_layer_norm: center
  heads_use_weight_norm: true
  heads_init: sphere
  regularisation:
    reg_student: false
    reg_teacher: true
    codebook_entropy_weight: 0.1
    codebook_entropy_schedule: constant_then_exponential_decrease
    predictive_entropy_weight: 0.1
    predictive_entropy_schedule: constant

optimizer:
  lr: 5.0e-4
  max_steps: 50
  warmup_steps: 5
  hold_steps: 10
  decay_steps: 35
  dtype: float32

masking:
  mask_prob: 0.5
  mask_length: 4

validation: {}
