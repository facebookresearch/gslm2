# GSLM2 multi-stream SLM (300M) on Libri-Light 6Kh.
# Paper: 25k steps, 32 GPUs (DDP), global batch 1310720 units, ctx 4096,
# peak LR 5e-3 (cosine, 1k warmup). Per-GPU batch: 10 rows x 4096.
# Streams/losses as in ll-600h-90m.yaml (alpha=beta=0.1); manifests first.
# NOTE: online validation for pre-extracted sources is not wired yet.
run:
  workdir: /path/to/runs/gslm2-ll-6kh-300m
  wandb_project: gslm2
  wandb_name: gslm2-ll-6kh-300m-seed0
  wandb_mode: offline
  random_seed: 0
  slurm:
    nodes: 4
    gpus_per_node: 8
    cpus_per_task: 16
  log_interval: 100
  save_interval: 1000
  model_type: msopt
  keep_latest: 1

data:
  num_streams: 6
  source:
    manifests:
      - /path/to/gslm2-ll-6kh-units.txt
    manifests_weights: [1.0]
    unit_offset: 2
    pad_idx: 1
    max_seq_len: 4096
    min_seq_len: 2
    batch_size: 10
    drop_last: true
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: true
    random_seed: 0

model:
  vocab_sizes: [258, 258, 258, 258, 258, 258]
  model_dim: 1024
  num_layers: 24
  num_attn_heads: 16
  num_key_value_heads: 16
  ffn_inner_dim: 4096
  max_seq_len: 4096
  attn_window_len: 4096
  pad_idx: 1
  ffn_activation: relu
  pos_embed_pad_offset: 2
  init_scheme: fairseq2
  multi_pred_loss_weight: 0.1
  self_distil_loss_weight: 1.0
  gen_loss_weight: 0.1
  distill_temperature: 1.0
  depformer_model_dim: 256
  depformer_num_layers: 6
  depformer_num_attn_heads: 4
  depformer_num_key_value_heads: 4
  depformer_ffn_inner_dim: 1024
  depformer_generation_order: [5, 0, 1, 4, 3, 2]

optimizer:
  lr: 0.005
  betas: [0.9, 0.95]
  eps: 1.0e-08
  weight_decay: 0.1
  max_norm: 0.5
  dtype: bfloat16
  scheduler: cosine
  max_steps: 25000
  warmup_steps: 1000
  init_lr_scale: 1.0e-28
  final_lr_scale: 0.1
