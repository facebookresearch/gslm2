[build-system]
requires = ["setuptools>=75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gslm2"
version = "0.1"
requires-python = ">=3.12"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
    "torch==2.13.0",
    "torchcodec==0.14.0",
    "torchaudio>=2.11.0",
    "fastabx>=0.8.0",
    "speech-map>=0.1.2",
    "discophon",
    "soundfile>=0.13.1",
    "numpy>=2.1.3,<2.4",
    "tqdm>=4.66.6",
    "pandas>=2.2.3",
    "polars>=1.31.0",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.2",
    "submitit>=1.5.2",
    "wandb>=0.18.5",
    "scikit-learn>=1.7.0",
    "transformers>=4.56.2",
    "joblib>=1.5.2",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "safetensors>=0.6.2",
    "openai-whisper==20250625",
    "utmos-pytorch==0.1.0",
]

[project.optional-dependencies]
# fairseq2 SLM pipeline (gslm2.fs2). Needs torch==2.9.* (fairseq2~=0.7.0),
# which conflicts with the default torch 2.13 env -> install into a dedicated env.
fs2 = ["fairseq2~=0.7.0"]

[project.entry-points."fairseq2.extension"]
"fairseq2" = "gslm2.fs2.register:setup_fairseq2_extension"

[dependency-groups]
dev = [
    "ruff==0.11.9",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
]

[project.scripts]
gslm2-train = "gslm2.__main__:main"
gslm2-eval-abx = "gslm2.eval.encoder.abx:main"
gslm2-eval-map = "gslm2.eval.encoder.map:main"
gslm2-eval-codebook = "gslm2.eval.encoder.codebook:main"
gslm2-eval-discophon = "gslm2.eval.encoder.discophon:main"
gslm2-learn-kmeans = "gslm2.eval.slm.learn_kmeans:main"
gslm2-extract-units = "gslm2.eval.slm.extract_units:main"
gslm2-eval-slm = "gslm2.eval.slm.score_benchmarks:main"
gslm2-duration-predictor = "gslm2.vocoder.duration.__main__:main"
gslm2-unit-vocoder = "gslm2.vocoder.unit.__main__:main"
gslm2-synthesize = "gslm2.vocoder.unit.inference:main"
gslm2-eval-resynthesis = "gslm2.vocoder.unit.eval_resynthesis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA + dataset/checkpoint paths",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "COM812",
    "D",
    "E501",
    "EM101",
    "EM102",
    "ERA001",
    "ISC001",
    "PD011",
    "PLC0414",
    "PT009",
    "PT027",
    "PTH206",
    "S101",
    "S311",
    "S602",
    "S603",
    "TRY003",
]
select = ["ALL"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["F"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN201", "ANN202", "ARG002", "INP001", "PLR2004", "T201", "TC003", "TRY004", "S404", "S603", "S607", "SLF001"]
"scripts/**/*.py" = ["INP001", "T201", "PLR0915"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
