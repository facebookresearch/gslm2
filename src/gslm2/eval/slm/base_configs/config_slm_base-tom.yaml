slm:
  run_postfix: 
  launch_during_training: True
  common_folder: /checkpoint/devai/tomfizycki/features/speech_units/slm__6kh__full__spidr-interm1.5-codes__KL+shared-reg+codebook-reg-0.1-to-0+predictive-reg-0.1-constant+adaptive-codebook-reg-0.55-target__seed-1__step-400000
  output_results_file: /home/tomfizycki/metasr-internal/results/slm__6kh__full__spidr-interm1.5-codes__KL+shared-reg+codebook-reg-0.1-to-0+predictive-reg-0.1-constant+adaptive-codebook-reg-0.55-target__seed-1__step-400000.jsonl
  feature_extraction:
    checkpoint: /checkpoint/devai/tomfizycki/spidr-codebooks/full__spidr-interm1__KL+shared-reg+codebook-reg-0.1-to-0+predictive-reg-0.1-constant+adaptive-codebook-reg-0.55-target__seed-0/final.pt
    # checkpoint: /datasets/metaspeechssl/shared/models/spidr_checkpoints/ssl_paper/spidr-librispeech-compile/step_400000.pt
    model_type: spidr
    clustering: codes
    deduplicate: true
    vocab_size: 256
    layers: [5,6,7,8,9,10,11,12]
    overwrite_folder: False
    manifests_train_kmeans: 
      - "/datasets/metaspeechssl/shared/assets/manifests/train-clean-100.csv"
    manifests_train:
      # - "/datasets/metaspeechssl/shared/assets/manifests/librilight/train_6kh.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/librilight/small_segmented_60s.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/librilight/medium_segmented_60s.csv"
      # - "/datasets/metaspeechssl/shared/assets/manifests/emilia/6k_en.csv"
    manifests_valid:
      - "/datasets/metaspeechssl/shared/assets/manifests/librilight/large_segmented_60s_dev.csv"
    manifests_test:
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/lexical_dev_invocab.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/lexical_dev_oov.csv"
      # - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/lexical_dev_copy.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/lexical_test_invocab.csv" # Test invocab manifest for final metric
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/lexical_test_oov.csv"    # Test oov manifest for final metric
      # - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/lexical_test_copy.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/syntactic_test.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/syntactic_dev.csv"     # Test manifest for final metric
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/sSC.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/tSC.csv"
      - "/datasets/metaspeechssl/shared/assets/manifests/sLM21-dataset/tSC_dev_expanded.csv"
  train:
    dataset:
      family: metasr_unit
      train_split: train
      valid_split: valid
      valid_metrics:
        names:
          - "tSC"
          - "tSC_dev_expanded"
          - "lexical_dev_invocab"
          - "lexical_dev_oov"
          - "syntactic_dev"
        max_pairs: 1000
        batch_size: 32
      min_seq_len: 2
      max_seq_len: 2048
      max_num_tokens: 81920
      batch_shuffle_window: 1000
      example_shuffle_window: 0  # shuffle the entire dataset
    trainer:
      dtype: bfloat16
      gradient_accumulation: 1
      max_gradient_norm: 0.5
      gradient_check: false
      anomaly_detection: false
    optimizer:
      config:
        lr: 1e-2
        betas:
        - 0.9
        - 0.95
        eps: 1e-08
        weight_decay: 0.1  # initially 0.1, but 0.01 is the default AdamW value
        differentiable: false
        impl: fused
      name: adamw
    lr_scheduler:
      config:
        cycle_len: null
        num_warmup_steps: 1000
        cycle_mul: 1.0
        lr_mul: 1.0
        start_lr: 1e-30
        final_lr: null
        final_lr_scale: 0.1
      name: cosine_annealing
    regime:
      num_steps: 25000
      validate_at_start: True
      validate_every_n_steps: 1000
      checkpoint_every_n_steps: 1000
      publish_metrics_every_n_steps: 1000
      keep_best_n_checkpoints: 2
      keep_last_n_checkpoints: 1
    early_stopping:
      enabled: false
      patience: 0 # patience == 0 disables early stopping
    common:
      metric_recorders:
        wandb:
          enabled: true
          project: fast_slm
          run_id: null
          run_name: null
          group: null
          job_type: null
          resume: allow
  eval: 
    offset: 2
    bos:
    delete_data_model_after_eval: True
